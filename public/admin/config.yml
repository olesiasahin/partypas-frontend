# PartyPas content panel — Sveltia CMS
# ------------------------------------
# Saving in the panel commits straight to `main`, which triggers the GitHub
# Actions deploy (.github/workflows/deploy.yml). Live in ~2 minutes.
#
# The five languages are edited side by side on one screen. Turkish is the
# default locale, matching i18next's fallbackLng.

backend:
  name: github
  repo: olesiasahin/partypas-frontend
  branch: main
  commit_messages:
    update: 'content: update {{collection}} “{{slug}}”'
    uploadMedia: 'content: upload {{path}}'
    deleteMedia: 'content: delete {{path}}'

site_url: https://partypas.com
display_url: https://partypas.com
logo_url: https://partypas.com/logo-gold.png

media_folder: public/images
public_folder: /images

i18n:
  structure: multiple_folders
  locales: [tr, en, uk, ru, fr]
  default_locale: tr

collections:
  # ---------------------------------------------------------------- texts
  - name: texts
    label: Website texts
    label_singular: page
    description: All wording on the site, in all five languages.
    i18n: true
    files:
      - name: site
        label: Menu, brand & footer
        file: src/content/{{locale}}/site.json
        i18n: true
        fields:
          - name: brand
            label: Brand
            widget: object
            i18n: true
            fields:
              - { name: name, label: Brand name, widget: string, i18n: true }
              - { name: tagline, label: Tagline, widget: string, i18n: true }
          - name: nav
            label: Menu
            widget: object
            i18n: true
            fields:
              - { name: home, label: Home, widget: string, i18n: true }
              - { name: classes, label: Classes, widget: string, i18n: true }
              - { name: programs, label: Programs, widget: string, i18n: true }
              - { name: about, label: About, widget: string, i18n: true }
              - { name: how, label: How it works, widget: string, i18n: true }
              - { name: blog, label: Blog & FAQ, widget: string, i18n: true }
              - { name: contact, label: Contact, widget: string, i18n: true }
              - { name: cta, label: Button — Start your classes, widget: string, i18n: true }
          - name: footer
            label: Footer
            widget: object
            i18n: true
            fields:
              - { name: tagline, label: Tagline, widget: string, i18n: true }
              - { name: rights, label: Rights line, widget: string, i18n: true }
              - { name: languages, label: Language label, widget: string, i18n: true }

      - name: home
        label: Home page
        file: src/content/{{locale}}/home.json
        i18n: true
        fields:
          - name: hero
            label: Hero
            widget: object
            i18n: true
            fields:
              - { name: title, label: Headline, widget: text, i18n: true, hint: 'Each new line becomes a line break on the page.' }
              - { name: subtitle, label: Sub-headline, widget: text, i18n: true, hint: 'Each new line becomes a line break on the page.' }
              - { name: cta, label: Button, widget: string, i18n: true }
          - name: disciplines
            label: The three classes
            widget: object
            i18n: true
            fields:
              - name: classical
                label: Classical
                widget: object
                i18n: true
                fields:
                  - { name: name, label: Name, widget: string, i18n: true }
                  - name: lines
                    label: Keywords
                    widget: list
                    i18n: true
                    field: { name: line, label: Keyword, widget: string, i18n: true }
                  - { name: more, label: Link text, widget: string, i18n: true }
              - name: ballroom
                label: Ballroom
                widget: object
                i18n: true
                fields:
                  - { name: name, label: Name, widget: string, i18n: true }
                  - name: lines
                    label: Keywords
                    widget: list
                    i18n: true
                    field: { name: line, label: Keyword, widget: string, i18n: true }
                  - { name: more, label: Link text, widget: string, i18n: true }
              - name: stretching
                label: Stretching
                widget: object
                i18n: true
                fields:
                  - { name: name, label: Name, widget: string, i18n: true }
                  - name: lines
                    label: Keywords
                    widget: list
                    i18n: true
                    field: { name: line, label: Keyword, widget: string, i18n: true }
                  - { name: more, label: Link text, widget: string, i18n: true }
          - name: how
            label: How it works
            widget: object
            i18n: true
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string, i18n: true }
              - { name: title, label: Headline, widget: text, i18n: true, hint: 'Each new line becomes a line break on the page.' }
              - { name: more, label: Link text, widget: string, i18n: true }
              - name: steps
                label: Steps
                widget: list
                i18n: true
                field: { name: step, label: Step, widget: string, i18n: true }
          - name: teacher
            label: Teacher block
            widget: object
            i18n: true
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string, i18n: true }
              - { name: title, label: Headline, widget: text, i18n: true, hint: 'Each new line becomes a line break on the page.' }
              - { name: text, label: Text, widget: text, i18n: true }
              - { name: more, label: Link text, widget: string, i18n: true }
          - name: footerCta
            label: Closing call to action
            widget: object
            i18n: true
            fields:
              - { name: title, label: Headline, widget: string, i18n: true }
              - { name: text, label: Text, widget: text, i18n: true }
              - { name: button, label: Button, widget: string, i18n: true }

      - name: pages
        label: Inner pages
        file: src/content/{{locale}}/pages.json
        i18n: true
        fields:
          - name: pages
            label: Pages
            widget: object
            i18n: true
            fields:
              - name: classical
                label: Classical
                widget: object
                i18n: true
                fields: &innerpage
                  - { name: title, label: Title, widget: string, i18n: true }
                  - { name: lead, label: Intro line, widget: text, i18n: true }
                  - { name: body, label: Body text, widget: text, i18n: true }
              - { name: ballroom, label: Ballroom, widget: object, i18n: true, fields: *innerpage }
              - { name: stretching, label: Stretching, widget: object, i18n: true, fields: *innerpage }
              - { name: whyOnline, label: Why online, widget: object, i18n: true, fields: *innerpage }
              - { name: about, label: About, widget: object, i18n: true, fields: *innerpage }
              - { name: programs, label: Programs, widget: object, i18n: true, fields: *innerpage }
              - { name: contact, label: Contact, widget: object, i18n: true, fields: *innerpage }
              - { name: trial, label: Start your classes, widget: object, i18n: true, fields: *innerpage }

      - name: programs
        label: Programs & prices
        file: src/content/{{locale}}/programs.json
        i18n: true
        fields:
          - name: programList
            label: Programs
            widget: list
            i18n: true
            summary: '{{fields.name}} — {{fields.price}}'
            fields:
              - { name: name, label: Name, widget: string, i18n: true }
              - { name: details, label: Details, widget: string, i18n: true }
              - { name: price, label: Price, widget: string, i18n: true }

      - name: booking
        label: Booking page
        file: src/content/{{locale}}/booking.json
        i18n: true
        fields:
          - name: appointment
            label: Booking
            widget: object
            i18n: true
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string, i18n: true }
              - { name: title, label: Title, widget: string, i18n: true }
              - { name: intro, label: Intro, widget: text, i18n: true }
              - name: steps
                label: How booking works
                widget: object
                i18n: true
                fields:
                  - { name: title, label: Section title, widget: string, i18n: true }
                  - name: items
                    label: Steps
                    widget: list
                    i18n: true
                    summary: '{{fields.title}}'
                    fields:
                      - { name: title, label: Step title, widget: string, i18n: true }
                      - { name: text, label: Step text, widget: text, i18n: true }
              - { name: widgetTitle, label: Calendar heading, widget: string, i18n: true }
              - { name: widgetPlaceholder, label: Calendar placeholder text, widget: text, i18n: true }
              - { name: paymentNote, label: Payment note, widget: text, i18n: true }
              - { name: cta, label: Button, widget: string, i18n: true }

      - name: contact
        label: Contact page
        file: src/content/{{locale}}/contact.json
        i18n: true
        fields:
          - name: contact
            label: Contact
            widget: object
            i18n: true
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string, i18n: true }
              - { name: title, label: Title, widget: string, i18n: true }
              - { name: text, label: Text, widget: text, i18n: true }
              - { name: emailLabel, label: E-mail label, widget: string, i18n: true }
              - { name: email, label: E-mail address, widget: string, i18n: duplicate }
              - { name: appointmentTitle, label: Booking block title, widget: string, i18n: true }
              - { name: appointmentText, label: Booking block text, widget: text, i18n: true }
              - { name: appointmentCta, label: Booking button, widget: string, i18n: true }

      - name: blog
        label: Blog & FAQ
        file: src/content/{{locale}}/blog.json
        i18n: true
        fields:
          - name: blog
            label: Blog & FAQ
            widget: object
            i18n: true
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string, i18n: true }
              - { name: title, label: Page title, widget: string, i18n: true }
              - { name: intro, label: Intro, widget: text, i18n: true }
              - { name: readMore, label: '“Read more” link text', widget: string, i18n: true }
              - { name: faqTitle, label: FAQ section title, widget: string, i18n: true }
              - name: posts
                label: Blog posts
                widget: list
                i18n: true
                summary: '{{fields.title}}'
                fields:
                  - { name: title, label: Title, widget: string, i18n: true }
                  - { name: excerpt, label: Teaser, widget: text, i18n: true }
                  - name: body
                    label: Full text
                    widget: text
                    required: false
                    i18n: true
                    hint: 'Optional. Leave empty and the card stays a teaser; fill it in and “Read more” expands it. Blank line = new paragraph.'
              - name: faq
                label: FAQ
                widget: list
                i18n: true
                summary: '{{fields.q}}'
                fields:
                  - { name: q, label: Question, widget: string, i18n: true }
                  - { name: a, label: Answer, widget: text, i18n: true }

  # ------------------------------------------------------------- settings
  - name: settings
    label: Site settings
    label_singular: settings
    description: Contact details, photos and logos. Not translated — one value for all languages.
    files:
      - name: settings
        label: Contact, photos & logos
        file: src/content/settings.json
        fields:
          - name: contact
            label: Contact details
            widget: object
            fields:
              - { name: email, label: E-mail, widget: string, hint: 'Shown on the Contact page and in the footer.' }
              - { name: phone, label: Phone / WhatsApp number, widget: string, required: false, hint: 'Leave empty to hide the phone block entirely.' }
              - { name: whatsapp, label: WhatsApp link, widget: string, required: false, hint: 'e.g. https://wa.me/905530475740 — leave empty to hide.' }
              - { name: instagram, label: Instagram handle, widget: string, required: false, hint: 'e.g. @party_pas — leave empty to hide.' }
              - { name: instagramUrl, label: Instagram link, widget: string, required: false }
          - name: images
            label: Photos
            widget: object
            fields:
              - { name: hero, label: Home hero photo, widget: image }
              - { name: classical, label: Classical photo, widget: image }
              - { name: ballroom, label: Ballroom photo, widget: image }
              - { name: stretching, label: Stretching photo, widget: image }
              - { name: editorial, label: Editorial photo, widget: image }
              - { name: online, label: '“Why online” photo', widget: image }
              - { name: teacher, label: Teacher photo, widget: image }
          - name: logos
            label: Logos
            widget: object
            fields:
              - name: dark
                label: Logo on dark background
                widget: image
                media_folder: /public
                public_folder: /
              - name: light
                label: Logo watermark on photos
                widget: image
                media_folder: /public
                public_folder: /
